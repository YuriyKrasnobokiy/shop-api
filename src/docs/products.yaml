paths:
  /products:
    get:
      tags:
        - Products
      summary: Get products list
      description: Returns paginated list of products
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            example: 0
            default: 0
          description: Number of products to skip
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
            default: 10
          description: Number of products to return
        - in: query
          name: category
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
          description: Filter products by category id
        - in: query
          name: search
          schema:
            type: string
            example: metallica
          description: Search products by name or band
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - price
              - band
          description: Field to sort by (price or band)
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction (asc or desc)
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsPage'
              example:
                data:
                  - id: 1
                    name: Metallica Logo T-Shirt
                    band: Metallica
                    categoryId: 0
                    price: 25
                    stock: 20
                    size: L
                    image: /images/products/metallica-shirt.jpg
                    description: Classic Metallica logo T-shirt made from 100% cotton.
                offset: 0
                limit: 10
                count: 20
  /products/categories:
    get:
      tags:
        - Products
      summary: Get all products categories
      description: List of categories
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            example: 0
            default: 0
          description: Number of categories to skip
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
            default: 10
          description: Number of categories to return
      responses:
        '200':
          description: Categories found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesPage'
              example:
                data:
                  - id: 0
                    name: tshirt
                    label: T-Shirts
                  - id: 1
                    name: cd
                    label: CD
                  - id: 2
                    name: vinyl
                    label: Vinyl
                offset: 0
                limit: 10
                count: 3
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            example: 3
          description: Product ID
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 3
                name: Black Sabbath Logo T-Shirt
                band: Black Sabbath
                categoryId: 0
                price: 24
                stock: 16
                size: XL
                image: /images/products/sabbath-shirt.jpg
                description: Vintage Black Sabbath logo T-shirt.
        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid id
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Product not found
