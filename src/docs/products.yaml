
paths:
  /products:
    get:
      tags:
        - Products
      summary: Get products list
      description: Returns paginated list of products
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            example: 0
            default: 0
          description: Number of products to skip
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            example: 10
            default: 10
          description: Number of products to return
        - in: query
          name: category
          schema:
            type: integer
            enum: [0, 1, 2]
          description: Filter products by category ID
        - in: query
          name: search
          schema:
            type: string
            example: metallica
          description: Search products by name or band
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [price, band]
          description: Field to sort by
        - in: query
          name: sort
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort direction
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsPage'
              example:
                data:
                  - id: Vr5zwwxYshs0oy0LyFbXT
                    name: Metallica Logo T-Shirt
                    band: Metallica
                    categoryId: 0
                    price: 25
                    stock: 20
                    size: L
                    image: /images/products/metallica-shirt.jpg
                    description: Classic Metallica logo T-shirt made from 100% cotton.
                offset: 0
                limit: 10
                count: 20

    post:
      tags:
        - Products
      summary: Create a new product
      description: Creates a product with an automatically generated Nano ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
            example:
              name: Metallica Logo T-Shirt
              band: Metallica
              categoryId: 0
              price: 25
              stock: 20
              size: L
              image: /images/products/metallica-shirt.jpg
              description: Classic Metallica logo T-shirt.
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: Vr5zwwxYshs0oy0LyFbXT
                name: Metallica Logo T-Shirt
                band: Metallica
                categoryId: 0
                price: 25
                stock: 20
                size: L
                image: /images/products/metallica-shirt.jpg
                description: Classic Metallica logo T-shirt.
        '400':
          description: Invalid product data (requires validation middleware)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/categories:
    get:
      tags:
        - Products
      summary: Get all products categories
      description: Returns paginated list of categories
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            example: 0
            default: 0
          description: Number of categories to skip
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            example: 10
            default: 10
          description: Number of categories to return
      responses:
        '200':
          description: Categories found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesPage'
              example:
                data:
                  - id: 0
                    name: tshirt
                    label: T-Shirts
                  - id: 1
                    name: cd
                    label: CD
                  - id: 2
                    name: vinyl
                    label: Vinyl
                offset: 0
                limit: 10
                count: 3

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: Vr5zwwxYshs0oy0LyFbXT
          description: Product Nano ID
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: Vr5zwwxYshs0oy0LyFbXT
                name: Metallica Logo T-Shirt
                band: Metallica
                categoryId: 0
                price: 25
                stock: 20
                size: L
                image: /images/products/metallica-shirt.jpg
                description: Classic Metallica logo T-shirt made from 100% cotton.
        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid id
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Product not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
